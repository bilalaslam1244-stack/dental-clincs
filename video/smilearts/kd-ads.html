<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Smile Arts Kota Damansara ads</title>
<!-- Patient-facing Meta ads for Smile Arts Dental Kota Damansara (free 2-week trial), in the clinic's own
     poster style: cream or espresso, gold accents, serif headlines, Dr. Daren's studio portrait.
     Open with ?c=<concept>&f=<916|45>&l=<en|zh|ms>; tools/render-smilearts.mjs screenshots every combination.
     Each concept has its own layout so the set doesn't look samey in the feed (see CFG below):
     braces (portrait), implants (treatment-room photo on top), veneers (reception photo behind the portrait),
     and price ads implant5000, aligner, scaling (offer layout) with visuals cropped from the clinic's own promo
     posters. Every ad carries a "Book now" button. The price ads replicate the packages on smilearts.com.my without "only", scarcity or before/after (MDC); Dr. Daren
     confirms the prices and that each ad is within MDC rules before anything runs. -->
<style>
  @font-face { font-family: Tajawal; font-weight: 400; src: url(../assets/fonts/Tajawal-400-latin.woff2); }
  @font-face { font-family: Tajawal; font-weight: 500; src: url(../assets/fonts/Tajawal-500-latin.woff2); }
  @font-face { font-family: Tajawal; font-weight: 700; src: url(../assets/fonts/Tajawal-700-latin.woff2); }
  @font-face { font-family: Tajawal; font-weight: 800; src: url(../assets/fonts/Tajawal-800-latin.woff2); }
  @font-face { font-family: Playfair; font-weight: 500 600; src: url(../assets/fonts/PlayfairDisplay-600-normal-latin.woff2); }
  @font-face { font-family: Playfair; font-weight: 500; font-style: italic; src: url(../assets/fonts/PlayfairDisplay-500-italic-latin.woff2); }
  @font-face { font-family: "Noto Sans SC"; font-weight: 500; src: url(../assets/fonts/NotoSansSC-500-smilearts-subset.woff2); }
  @font-face { font-family: "Noto Sans SC"; font-weight: 700; src: url(../assets/fonts/NotoSansSC-700-smilearts-subset.woff2); }
  @font-face { font-family: "Noto Serif SC"; font-weight: 700; src: url(../assets/fonts/NotoSerifSC-700-smilearts-subset.woff2); }
  :root { --sans: Tajawal, "Noto Sans SC", Arial, sans-serif; --serif: Playfair, "Noto Serif SC", Georgia, serif;
          --gold: linear-gradient(100deg, #9c7440 0%, #d9b77b 38%, #f1dcaa 52%, #c9a063 70%, #9c7440 100%);
          --gold-ink: #94703f; --espresso: #221a14; }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: #f6f0e7; }
  .ad { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: var(--sans);
        --bg: #f6f0e7; --ink: #231b15; --ink-2: #5b4f44; --accent: var(--gold-ink); --hair: rgba(148,112,63,.38);
        background: radial-gradient(120% 70% at 85% 30%, #fffaf2 0%, var(--bg) 55%, #efe6d8 100%); color: var(--ink); }
  .f45 .ad { height: 1350px; }
  .dark .ad { --bg: #2a211a; --ink: #f6efe4; --ink-2: #cdbfae; --accent: #d9b77b; --hair: rgba(217,183,123,.35);
              background: radial-gradient(110% 70% at 80% 35%, #3a2d22 0%, #261d16 50%, #17110d 100%); }

  /* gold arc behind the portrait, as on the clinic's own posters */
  .arc { position: absolute; width: 900px; height: 900px; right: -380px; top: 560px; border-radius: 50%;
         border: 3px solid transparent; background: var(--gold) border-box;
         -webkit-mask: linear-gradient(#000 0 0) padding-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; opacity: .7; }
  .f45 .arc { width: 700px; height: 700px; top: 420px; right: -290px; }
  .portrait { position: absolute; height: 980px; right: 0; bottom: 300px; filter: drop-shadow(0 30px 40px rgba(20,14,10,.28)); }
  .f45 .portrait { height: 760px; right: 10px; bottom: 160px; }

  .top { position: absolute; left: 70px; right: 70px; top: 250px; display: flex; justify-content: space-between; align-items: center; }
  .f45 .top { top: 56px; }
  .top img { height: 70px; }
  .f45 .top img { height: 56px; }
  .top span { font: 700 23px var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--accent); }
  .f45 .top span { font-size: 20px; }

  .head { position: absolute; left: 70px; right: 70px; top: 380px; display: flex; flex-direction: column; gap: 18px; }
  .f45 .head { top: 150px; gap: 12px; }
  .eyebrow { display: flex; align-items: center; gap: 18px; font: 700 25px var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--accent); }
  .eyebrow::before { content: ""; width: 56px; height: 2px; background: var(--gold); }
  .f45 .eyebrow { font-size: 21px; }
  h1 { font: 600 94px/1.03 var(--serif); letter-spacing: -.01em; text-wrap: balance; }
  .f45 h1 { font-size: 72px; }
  h1 em { font-style: italic; font-weight: 500; background: var(--gold); -webkit-background-clip: text; background-clip: text; color: transparent; padding-right: 6px; }
  .cream h1 em { background: none; color: var(--gold-ink); }

  /* left column beside the portrait */
  .col { position: absolute; left: 70px; width: 470px; top: 760px; display: flex; flex-direction: column; gap: 26px; }
  .f45 .col { top: 470px; width: 430px; gap: 18px; }
  .sub { font: 400 38px/1.34 var(--sans); color: var(--ink-2); }
  .f45 .sub { font-size: 29px; }
  .price-label { font: 700 24px var(--sans); letter-spacing: .22em; text-transform: uppercase; color: var(--accent); }
  .price { font: 800 132px/.92 var(--sans); letter-spacing: -.03em; background: var(--gold); -webkit-background-clip: text; background-clip: text; color: transparent; white-space: nowrap; }
  .price small { font-size: .42em; letter-spacing: 0; margin-right: 8px; }
  .price-to { font: 700 40px var(--sans); color: var(--ink); margin-top: -8px; }
  .f45 .price { font-size: 104px; }
  .f45 .price-to { font-size: 32px; }
  .list { display: flex; flex-direction: column; border-top: 1px solid var(--hair); }
  .list p { display: flex; align-items: center; gap: 16px; font: 500 31px/1.2 var(--sans); padding: 17px 0 13px; border-bottom: 1px solid var(--hair); color: var(--ink); }
  .list p::before { content: ""; flex: none; width: 22px; height: 12px; border-left: 3px solid var(--accent); border-bottom: 3px solid var(--accent); transform: rotate(-45deg) translateY(-4px); }
  .f45 .list p { font-size: 24px; padding: 10px 0 8px; }
  .fine { font: 400 22px/1.35 var(--sans); color: var(--ink-2); opacity: .9; }
  .f45 .fine { font-size: 19px; }

  /* name tag on the portrait */
  .tag { position: absolute; left: 70px; width: 470px; bottom: 410px; padding-left: 24px; border-left: 3px solid #c9a063; }
  .f45 .tag { bottom: 236px; width: 430px; padding-left: 18px; }
  .tag b { display: block; font: 500 italic 46px/1.1 var(--serif); color: var(--ink); }
  .tag span { display: block; font: 500 25px/1.4 var(--sans); color: var(--ink-2); margin-top: 6px; }
  .f45 .tag b { font-size: 34px; }
  .f45 .tag span { font-size: 20px; margin-top: 2px; }

  /* contact band, like the strip along the bottom of the clinic's posters */
  .band { position: absolute; left: 0; right: 0; bottom: 0; height: 360px; background: linear-gradient(180deg, #2a211a, #17110d); color: #f6efe4; }
  .band::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: var(--gold); }
  .f45 .band { height: 200px; }
  .band .row { position: absolute; left: 70px; right: 70px; top: 48px; display: flex; justify-content: space-between; align-items: center; gap: 30px; }
  .f45 .band .row { top: 44px; }
  .wa { display: flex; align-items: center; gap: 22px; }
  .wa i { flex: none; width: 84px; height: 84px; border-radius: 50%; border: 2px solid #d9b77b; display: grid; place-items: center; }
  .f45 .wa i { width: 72px; height: 72px; }
  .wa svg { width: 44px; height: 44px; }
  .wa small { display: block; font: 700 21px var(--sans); letter-spacing: .2em; text-transform: uppercase; color: #d9b77b; margin-bottom: 6px; }
  .wa b { font: 800 50px/1 var(--sans); letter-spacing: .01em; }
  .f45 .wa b { font-size: 42px; }
  .where { text-align: right; border-left: 1px solid rgba(217,183,123,.4); padding-left: 30px; }
  .where b { display: block; font: 500 italic 38px var(--serif); color: #f1dcaa; }
  .where span { font: 500 26px var(--sans); color: #cdbfae; letter-spacing: .04em; }
  .f45 .where b { font-size: 32px; }
  .f45 .where span { font-size: 22px; }

  /* --- layouts --- */
  .ad { --solid: #f6f0e7; }
  .dark .ad { --solid: #211912; }
  .cream .price { background: linear-gradient(100deg, #6f4f25 0%, #a87d43 45%, #c99d5e 55%, #7d5a2c 100%); -webkit-background-clip: text; background-clip: text; }
  .tag .face { display: none; }
  .tag > div { min-width: 0; }

  /* photo across the top (implants: treatment room, clinic: shopfront) */
  .hero { position: absolute; left: 0; right: 0; top: 0; height: 1000px; overflow: hidden; }
  .f45 .hero { height: 560px; }
  .hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(20,14,10,.62) 0%, rgba(20,14,10,.12) 30%, rgba(20,14,10,0) 55%, var(--solid) 100%); }
  .L-phototop .top span { color: #f1dcaa; }
  .L-phototop .head { top: 1000px; }
  .f45.L-phototop .head { top: 572px; }
  .L-phototop .col { position: static; width: auto; margin-top: 8px; }
  .strip { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 6px; }
  .strip img { width: 100%; height: 330px; object-fit: cover; display: block; }
  .f45 .strip img { height: 200px; }
  .strip figure { margin: 0; position: relative; }
  .strip figcaption { position: absolute; left: 0; bottom: 0; padding: 8px 14px 6px; background: rgba(20,14,10,.7); color: #f1dcaa; font: 500 22px var(--sans); letter-spacing: .06em; }
  .f45 .strip figcaption { font-size: 18px; }
  .L-phototop .list { display: grid; grid-template-columns: 1fr 1fr; column-gap: 44px; border-top: 0; }
  .L-phototop .list p { border-top: 1px solid var(--hair); border-bottom: 0; }
  .L-phototop .tag, .L-visual .tag, .L-offer .tag { display: flex; align-items: center; gap: 20px; border-left: 0; padding-left: 0; width: auto; }
  .L-phototop .tag { bottom: auto; top: 800px; padding: 14px 28px 14px 14px; background: rgba(20,14,10,.6); border-left: 3px solid #c9a063; }
  .f45.L-phototop .tag { top: 410px; padding: 10px 20px 10px 10px; }
  .L-phototop .tag b { color: #f6efe4; }
  .L-phototop .tag span { color: #e3d3b9; }
  .L-phototop .tag .face, .L-visual .tag .face, .L-offer .tag .face { display: block; flex: none; width: 104px; height: 104px; border-radius: 50%; border: 3px solid #c9a063; object-fit: cover; }
  .f45 .tag .face { width: 78px !important; height: 78px !important; }

  /* full-bleed photo behind the whole ad (RM 399): only the ad's own edges, text side darkened */
  .bgphoto.full { top: 1130px; bottom: 300px; -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 42%); mask-image: linear-gradient(180deg, transparent 0%, #000 42%); }
  .bgphoto.full::after { display: none; }
  .f45 .bgphoto.full { -webkit-mask-image: none; mask-image: none; }
  .f45 .bgphoto.full::after { display: block; }
  .f45 .bgphoto.full { top: 0; bottom: 200px; }
  .bgphoto.full img { filter: brightness(.9) saturate(.9) sepia(.1); transform: none; object-position: 50% 42% !important; }
  .f45 .bgphoto.full img { object-position: 24% 30% !important; }
  .bgphoto.full::after { background:
      linear-gradient(90deg, rgba(26,19,14,.97) 0%, rgba(26,19,14,.93) 34%, rgba(26,19,14,.55) 56%, rgba(26,19,14,.08) 78%, rgba(26,19,14,0) 100%),
      linear-gradient(180deg, rgba(26,19,14,.96) 0%, rgba(26,19,14,.82) 28%, rgba(26,19,14,.2) 46%, rgba(26,19,14,0) 56%, rgba(26,19,14,0) 82%, rgba(26,19,14,.9) 100%); }
  .f45 .bgphoto.full::after { background:
      linear-gradient(90deg, rgba(26,19,14,.97) 0%, rgba(26,19,14,.93) 36%, rgba(26,19,14,.5) 58%, rgba(26,19,14,.05) 80%, rgba(26,19,14,0) 100%),
      linear-gradient(180deg, rgba(26,19,14,.95) 0%, rgba(26,19,14,.4) 26%, rgba(26,19,14,0) 42%, rgba(26,19,14,0) 82%, rgba(26,19,14,.9) 100%); }
  /* clinic photo behind the portrait (veneers: reception with the gold logo) */
  .bgphoto { position: absolute; inset: 0; overflow: hidden; }
  .bgphoto img { width: 100%; height: 100%; object-fit: cover; filter: blur(2px) saturate(.9); transform: scale(1.03); }
  .bgphoto::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(23,17,13,.6) 0%, rgba(23,17,13,0) 62%), linear-gradient(180deg, rgba(23,17,13,.82) 0%, rgba(23,17,13,.58) 40%, rgba(23,17,13,.7) 70%, rgba(23,17,13,.92) 100%); }

  /* promo visual on the right, faded into the background (price ads) */
  .visual { position: absolute; overflow: hidden; }
  .visual img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .visual.cut { overflow: visible; }
  .visual.cut::after { display: none; }
  .visual svg { display: block; }
  /* photos that fade to transparent on every side, so no edge of the original picture shows */
  .visual.soft::after { display: none; }
  .visual.soft { -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 34%, #000 74%, transparent 100%), linear-gradient(180deg, transparent 0%, #000 22%, #000 68%, transparent 100%);
                 -webkit-mask-composite: source-in; mask-composite: intersect; }
  .visual.soft img { filter: brightness(.82) contrast(1.05) saturate(.9) sepia(.1); }
  /* treatment photo blended into the dark background (RM 399), like the implant render */
  .visual.blend img { filter: brightness(.86) contrast(1.06) saturate(.88) sepia(.12); }
  .visual.blend::after { background: linear-gradient(90deg, var(--solid) 0%, rgba(33,25,18,.75) 16%, transparent 50%),
      linear-gradient(0deg, var(--solid) 0%, transparent 34%), linear-gradient(180deg, var(--solid) 0%, transparent 22%),
      linear-gradient(270deg, rgba(33,25,18,.35) 0%, transparent 18%); }
  /* treatment photo as a framed card */
  .visual.card { border-radius: 26px; border: 3px solid #c9a063; box-shadow: 0 30px 60px rgba(0,0,0,.45); }
  .visual.card::after { background: linear-gradient(180deg, transparent 60%, rgba(20,14,10,.35) 100%); }
  .f45 .visual.card { border-radius: 18px; border-width: 2px; }
  .visual.cut img { object-fit: contain; object-position: 50% 100%; filter: drop-shadow(0 26px 34px rgba(20,14,10,.3)); }
  .narrow.L-offer .col { width: 540px; }
  .offer-top .top span { color: var(--accent); }
  .offer-top .col { width: auto; right: 70px; }
  .offer-top .list { grid-template-columns: repeat(4, auto); justify-content: start; column-gap: 26px; }
  .offer-top .list p { border-top: 0; padding: 8px 0 4px; }
  .f45.offer-top .list { grid-template-columns: 1fr 1fr; }
  .visual::after { content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, var(--solid) 0%, transparent 38%), linear-gradient(0deg, var(--solid) 0%, transparent 26%), linear-gradient(180deg, var(--solid) 0%, transparent 14%); }

  /* "Book now" button inside every ad (Meta adds its own "Send WhatsApp message" button too) */
  .cta { align-self: flex-start; display: inline-flex; align-items: center; gap: 22px; padding: 22px 44px 20px 22px; border-radius: 999px;
         background: var(--gold); color: #1d1610; font: 800 42px/1 var(--sans); letter-spacing: .01em; box-shadow: 0 16px 34px rgba(60,40,15,.35); white-space: nowrap; }
  .cta i { flex: none; width: 72px; height: 72px; border-radius: 50%; background: #1d1610; display: grid; place-items: center; }
  .cta i svg { width: 36px; height: 36px; }
  .cta b { font-weight: 800; font-size: 40px; margin-left: 2px; }
  .f45 .cta { font-size: 29px; padding: 14px 28px 12px 14px; gap: 16px; }
  .f45 .cta i { width: 52px; height: 52px; }
  .f45 .cta i svg { width: 30px; height: 30px; }

  .perks { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 4px; }
  .perks span { display: inline-flex; align-items: center; gap: 9px; padding: 9px 16px 7px 12px; border: 2px solid var(--accent); border-radius: 999px; font: 700 22px/1 var(--sans); color: var(--ink); white-space: nowrap; }
  .L-portrait .sub, .L-photofull .sub, .L-phototop .sub { display: none; }
  .perks span::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--gold); }
  .f45 .perks { gap: 8px; }
  .f45 .perks span { font-size: 19px; padding: 7px 14px 5px 10px; border-width: 1.5px; }
  .f45 .perks span::before { width: 9px; height: 9px; }

  /* offer layout (price ads): big price, package tag, checklist, Book now */
  .L-offer .head { right: 70px; width: auto; }
  .L-offer h1 { font-size: 80px; }

  .f45.L-offer h1 { font-size: 62px; }
  .L-offer .col { width: 600px; top: 690px; gap: 18px; }
  .L-offer .tag { bottom: 384px; }
  .f45.L-offer .tag { bottom: 222px; }
  .f45.L-offer .col { width: 540px; top: 380px; gap: 16px; }
  .L-offer .price-label { align-self: flex-start; display: inline-block; padding: 9px 18px 6px; border: 2px solid var(--accent); margin-bottom: 10px; }
  .L-offer .price { font-size: 164px; line-height: .86; }
  .f45.L-offer .price { font-size: 140px; }
  .L-offer .list { display: grid; grid-template-columns: 1fr 1fr; column-gap: 28px; border-top: 0; }
  .L-offer .list p { padding: 12px 0 9px; font-size: 26px; border-top: 1px solid var(--hair); border-bottom: 0; }
  .f45.L-offer .list p { font-size: 22px; }
  .L-offer .cta { font-size: 40px; padding: 22px 44px 20px 22px; }
  .f45.L-offer .cta { font-size: 30px; padding: 14px 30px 12px 14px; }
  .L-offer .tag, .L-portrait .tag, .L-photofull .tag { }

  [lang="ms"] h1 { font-size: 88px; }
  .f45[lang="ms"] h1 { font-size: 68px; }
  [lang="zh"] h1 { font-size: 84px; line-height: 1.2; letter-spacing: .01em; }
  .f45[lang="zh"] h1 { font-size: 66px; }
  .L-offer[lang="zh"] h1 { font-size: 68px; }
  .L-offer[lang="ms"] h1 { font-size: 74px; }
  .f45.L-offer[lang="zh"] h1, .f45.L-offer[lang="ms"] h1 { font-size: 58px; }
  [lang="zh"] h1 em { font-style: normal; font-weight: 700; }
  [lang="zh"] .eyebrow, [lang="zh"] .top span, [lang="zh"] .price-label, [lang="zh"] .wa small { letter-spacing: .1em; }
</style>

<body>
<div class="ad">
  <div class="bgphoto"><img id="bgimg" alt=""></div>
  <div class="hero"><img id="heroimg" alt=""></div>
  <div class="arc"></div>
  <img class="portrait" src="source/daren-cutout-beige.png" alt="">
  <div class="top"><img id="logo" alt="Smile Arts Dental Clinic"><span id="branch"></span></div>
  <div class="head"><div class="eyebrow" id="eyebrow"></div><h1 id="h1"></h1></div>
  <div class="visual" id="visual"><img id="visimg" alt=""></div>
  <div class="col" id="col"></div>
  <div class="tag"><img class="face" src="source/daren-face-beige.jpg" alt=""><div><b>Dr. Daren Ang</b><span id="creds"></span></div></div>
  <div class="band"><div class="row">
    <div class="wa"><i><svg viewBox="0 0 24 24" fill="#d9b77b"><path d="M12 2.2a9.8 9.8 0 0 0-8.4 14.8L2.3 21.7l4.8-1.3A9.8 9.8 0 1 0 12 2.2zm0 17.8a8 8 0 0 1-4.1-1.1l-.3-.2-2.8.8.8-2.7-.2-.3A8 8 0 1 1 12 20zm4.4-6c-.2-.1-1.4-.7-1.6-.8s-.4-.1-.5.1-.6.8-.8.9-.3.2-.5.1a6.6 6.6 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.7-1.7c-.2-.5-.4-.4-.5-.4h-.5a.9.9 0 0 0-.7.3 2.8 2.8 0 0 0-.9 2.1 4.9 4.9 0 0 0 1 2.6 11.2 11.2 0 0 0 4.3 3.8c1.6.7 2.2.7 3 .6a2.6 2.6 0 0 0 1.7-1.2 2.1 2.1 0 0 0 .1-1.2c0-.1-.2-.2-.4-.3z"/></svg></i>
      <div><small id="book"></small><b>014-365 0270</b></div></div>
    <div class="where"><b id="addr"></b><span>Smile Arts Dental</span></div>
  </div></div>
</div>
<script>
const q = new URLSearchParams(location.search);
const c = q.get('c') || 'braces', f = q.get('f') || '916', l = q.get('l') || 'en';
// theme, layout and visual per concept; visual boxes are [right, top, width, height] per format, sized to keep
// the upscale of the small promo crops under ~1.6x
const CFG = {
  braces:      { theme: 'cream', layout: 'portrait' },
  implants:    { theme: 'cream', layout: 'phototop', img: 'source/WhatsApp-Image-2024-10-21-at-10.45.50-1.jpeg', pos: '50% 60%', hero: { 916: 840, 45: 540 } },
  veneers:     { theme: 'dark',  layout: 'photofull', img: 'source/bb9c0ade-4621-4961-8bdc-443c4c369d86.jpeg', pos: '30% 30%' },
  implant5000: { theme: 'dark',  layout: 'offer', noface: true, img: 'source/v-implant-cut.png', cut: true, box: { 916: [80, 600, 290, 654], 45: [70, 130, 215, 485] } },
  aligner:     { theme: 'cream', layout: 'offer', noface: true, img: 'source/v-aligner-case-cut.png', cut: true, box: { 916: [40, 600, 340, 397], 45: [60, 140, 290, 339] } },
  scaling:     { theme: 'dark',  layout: 'offer', noface: true, notag: true, narrow: true, full: true, pos: '24% 30%',
