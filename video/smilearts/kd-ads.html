<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Smile Arts Kota Damansara ads</title>
<!-- Patient-facing Meta ads for Smile Arts Dental Kota Damansara (free 2-week trial), in the clinic's own
     poster style: cream or espresso, gold accents, serif headlines, Dr. Daren's studio portrait.
     Open with ?c=<concept>&f=<916|45>&l=<en|zh>; tools/render-smilearts.mjs screenshots every combination.
     Treatment ads (cream): braces, implants, veneers. Price ads (espresso): implant5000, aligner, scaling
     replicate the packages on smilearts.com.my without "only", scarcity or before/after (MDC); Dr. Daren
     confirms the prices and that each ad is within MDC rules before anything runs. -->
<style>
  @font-face { font-family: Tajawal; font-weight: 400; src: url(../assets/fonts/Tajawal-400-latin.woff2); }
  @font-face { font-family: Tajawal; font-weight: 500; src: url(../assets/fonts/Tajawal-500-latin.woff2); }
  @font-face { font-family: Tajawal; font-weight: 700; src: url(../assets/fonts/Tajawal-700-latin.woff2); }
  @font-face { font-family: Tajawal; font-weight: 800; src: url(../assets/fonts/Tajawal-800-latin.woff2); }
  @font-face { font-family: Playfair; font-weight: 500 600; src: url(../assets/fonts/PlayfairDisplay-600-normal-latin.woff2); }
  @font-face { font-family: Playfair; font-weight: 500; font-style: italic; src: url(../assets/fonts/PlayfairDisplay-500-italic-latin.woff2); }
  @font-face { font-family: "Noto Sans SC"; font-weight: 500; src: url(../assets/fonts/NotoSansSC-500-smilearts-subset.woff2); }
  @font-face { font-family: "Noto Sans SC"; font-weight: 700; src: url(../assets/fonts/NotoSansSC-700-smilearts-subset.woff2); }
  @font-face { font-family: "Noto Serif SC"; font-weight: 700; src: url(../assets/fonts/NotoSerifSC-700-smilearts-subset.woff2); }
  :root { --sans: Tajawal, "Noto Sans SC", Arial, sans-serif; --serif: Playfair, "Noto Serif SC", Georgia, serif;
          --gold: linear-gradient(100deg, #9c7440 0%, #d9b77b 38%, #f1dcaa 52%, #c9a063 70%, #9c7440 100%);
          --gold-ink: #94703f; --espresso: #221a14; }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: #f6f0e7; }
  .ad { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: var(--sans);
        --bg: #f6f0e7; --ink: #231b15; --ink-2: #5b4f44; --accent: var(--gold-ink); --hair: rgba(148,112,63,.38);
        background: radial-gradient(120% 70% at 85% 30%, #fffaf2 0%, var(--bg) 55%, #efe6d8 100%); color: var(--ink); }
  .f45 .ad { height: 1350px; }
  .dark .ad { --bg: #2a211a; --ink: #f6efe4; --ink-2: #cdbfae; --accent: #d9b77b; --hair: rgba(217,183,123,.35);
              background: radial-gradient(110% 70% at 80% 35%, #3a2d22 0%, #261d16 50%, #17110d 100%); }

  /* gold arc behind the portrait, as on the clinic's own posters */
  .arc { position: absolute; width: 900px; height: 900px; right: -380px; top: 560px; border-radius: 50%;
         border: 3px solid transparent; background: var(--gold) border-box;
         -webkit-mask: linear-gradient(#000 0 0) padding-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; opacity: .7; }
  .f45 .arc { width: 700px; height: 700px; top: 420px; right: -290px; }
  .portrait { position: absolute; height: 960px; right: -200px; bottom: 316px; filter: drop-shadow(0 30px 40px rgba(20,14,10,.28)); }
  .f45 .portrait { height: 740px; right: -160px; bottom: 170px; }

  .top { position: absolute; left: 70px; right: 70px; top: 250px; display: flex; justify-content: space-between; align-items: center; }
  .f45 .top { top: 56px; }
  .top img { height: 70px; }
  .f45 .top img { height: 56px; }
  .top span { font: 700 23px var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--accent); }
  .f45 .top span { font-size: 20px; }

  .head { position: absolute; left: 70px; right: 70px; top: 380px; display: flex; flex-direction: column; gap: 18px; }
  .f45 .head { top: 150px; gap: 12px; }
  .eyebrow { display: flex; align-items: center; gap: 18px; font: 700 25px var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--accent); }
  .eyebrow::before { content: ""; width: 56px; height: 2px; background: var(--gold); }
  .f45 .eyebrow { font-size: 21px; }
  h1 { font: 600 94px/1.03 var(--serif); letter-spacing: -.01em; }
  .f45 h1 { font-size: 72px; }
  h1 em { font-style: italic; font-weight: 500; background: var(--gold); -webkit-background-clip: text; background-clip: text; color: transparent; padding-right: 6px; }
  .cream h1 em { background: none; color: var(--gold-ink); }

  /* left column beside the portrait */
  .col { position: absolute; left: 70px; width: 470px; top: 760px; display: flex; flex-direction: column; gap: 26px; }
  .f45 .col { top: 470px; width: 430px; gap: 18px; }
  .sub { font: 400 38px/1.34 var(--sans); color: var(--ink-2); }
  .f45 .sub { font-size: 29px; }
  .price-label { font: 700 24px var(--sans); letter-spacing: .22em; text-transform: uppercase; color: var(--accent); }
  .price { font: 800 132px/.92 var(--sans); letter-spacing: -.03em; background: var(--gold); -webkit-background-clip: text; background-clip: text; color: transparent; white-space: nowrap; }
  .price small { font-size: .42em; letter-spacing: 0; margin-right: 8px; }
  .price-to { font: 700 40px var(--sans); color: var(--ink); margin-top: -8px; }
  .f45 .price { font-size: 104px; }
  .f45 .price-to { font-size: 32px; }
  .list { display: flex; flex-direction: column; border-top: 1px solid var(--hair); }
  .list p { display: flex; align-items: center; gap: 16px; font: 500 31px/1.2 var(--sans); padding: 17px 0 13px; border-bottom: 1px solid var(--hair); color: var(--ink); }
  .list p::before { content: ""; flex: none; width: 22px; height: 12px; border-left: 3px solid var(--accent); border-bottom: 3px solid var(--accent); transform: rotate(-45deg) translateY(-4px); }
  .f45 .list p { font-size: 24px; padding: 10px 0 8px; }
  .fine { font: 400 22px/1.35 var(--sans); color: var(--ink-2); opacity: .9; }
  .f45 .fine { font-size: 19px; }

  /* name tag on the portrait */
  .tag { position: absolute; left: 70px; width: 470px; bottom: 410px; padding-left: 24px; border-left: 3px solid #c9a063; }
  .f45 .tag { bottom: 236px; width: 430px; padding-left: 18px; }
  .tag b { display: block; font: 500 italic 46px/1.1 var(--serif); color: var(--ink); }
  .tag span { display: block; font: 500 25px/1.4 var(--sans); color: var(--ink-2); margin-top: 6px; }
  .f45 .tag b { font-size: 34px; }
  .f45 .tag span { font-size: 20px; margin-top: 2px; }

  /* contact band, like the strip along the bottom of the clinic's posters */
  .band { position: absolute; left: 0; right: 0; bottom: 0; height: 360px; background: linear-gradient(180deg, #2a211a, #17110d); color: #f6efe4; }
  .band::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: var(--gold); }
  .f45 .band { height: 200px; }
  .band .row { position: absolute; left: 70px; right: 70px; top: 48px; display: flex; justify-content: space-between; align-items: center; gap: 30px; }
  .f45 .band .row { top: 44px; }
  .wa { display: flex; align-items: center; gap: 22px; }
  .wa i { flex: none; width: 84px; height: 84px; border-radius: 50%; border: 2px solid #d9b77b; display: grid; place-items: center; }
  .f45 .wa i { width: 72px; height: 72px; }
  .wa svg { width: 44px; height: 44px; }
  .wa small { display: block; font: 700 21px var(--sans); letter-spacing: .2em; text-transform: uppercase; color: #d9b77b; margin-bottom: 6px; }
  .wa b { font: 800 50px/1 var(--sans); letter-spacing: .01em; }
  .f45 .wa b { font-size: 42px; }
  .where { text-align: right; border-left: 1px solid rgba(217,183,123,.4); padding-left: 30px; }
  .where b { display: block; font: 500 italic 38px var(--serif); color: #f1dcaa; }
  .where span { font: 500 26px var(--sans); color: #cdbfae; letter-spacing: .04em; }
  .f45 .where b { font-size: 32px; }
  .f45 .where span { font-size: 22px; }

  [lang="zh"] h1 { font-size: 84px; line-height: 1.2; letter-spacing: .01em; }
  .f45[lang="zh"] h1 { font-size: 66px; }
  [lang="zh"] h1 em { font-style: normal; font-weight: 700; }
  [lang="zh"] .eyebrow, [lang="zh"] .top span, [lang="zh"] .price-label, [lang="zh"] .wa small { letter-spacing: .1em; }
</style>
</head>
<body>
<div class="ad">
  <div class="arc"></div>
  <img class="portrait" src="source/daren-cutout.png" alt="">
  <div class="top"><img id="logo" alt="Smile Arts Dental Clinic"><span id="branch"></span></div>
  <div class="head"><div class="eyebrow" id="eyebrow"></div><h1 id="h1"></h1></div>
  <div class="col" id="col"></div>
  <div class="tag"><b>Dr. Daren Ang</b><span id="creds"></span></div>
  <div class="band"><div class="row">
    <div class="wa"><i><svg viewBox="0 0 24 24" fill="#d9b77b"><path d="M12 2.2a9.8 9.8 0 0 0-8.4 14.8L2.3 21.7l4.8-1.3A9.8 9.8 0 1 0 12 2.2zm0 17.8a8 8 0 0 1-4.1-1.1l-.3-.2-2.8.8.8-2.7-.2-.3A8 8 0 1 1 12 20zm4.4-6c-.2-.1-1.4-.7-1.6-.8s-.4-.1-.5.1-.6.8-.8.9-.3.2-.5.1a6.6 6.6 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.7-1.7c-.2-.5-.4-.4-.5-.4h-.5a.9.9 0 0 0-.7.3 2.8 2.8 0 0 0-.9 2.1 4.9 4.9 0 0 0 1 2.6 11.2 11.2 0 0 0 4.3 3.8c1.6.7 2.2.7 3 .6a2.6 2.6 0 0 0 1.7-1.2 2.1 2.1 0 0 0 .1-1.2c0-.1-.2-.2-.4-.3z"/></svg></i>
      <div><small id="book"></small><b>014-365 0270</b></div></div>
    <div class="where"><b>The Strand</b><span id="addr"></span></div>
  </div></div>
</div>
<script>
const q = new URLSearchParams(location.search);
const c = q.get('c') || 'braces', f = q.get('f') || '916', l = q.get('l') || 'en';
const PRICE = ['implant5000', 'aligner', 'scaling'].includes(c);
document.documentElement.className = 'f' + f + (PRICE ? ' dark' : ' cream');
document.documentElement.lang = l;

const T = {
  en: {
    branch: 'Kota Damansara', creds: 'DDS (USM) · 18 years in practice', book: 'WhatsApp to book',
    addr: 'Kota Damansara',
    braces: { eyebrow: 'Braces & Invisalign', h1: 'Braces or Invisalign? <em>Ask before you decide.</em>',
      sub: 'Metal, ceramic or <span style="white-space:nowrap">self-ligating</span> braces, or clear aligners.',
      list: ['Bite and alignment check', 'Your options explained', 'Timeline and cost up front'] },
    implants: { eyebrow: 'Dental implants', h1: 'Missing a tooth? <em>See if an implant suits you.</em>',
      sub: 'Find out what is involved before you decide.',
      list: ['Suitability check', '3D CBCT imaging', 'Timeline and cost up front'] },
    veneers: { eyebrow: 'Porcelain veneers', h1: 'Chipped, stained or <em>uneven front teeth?</em>',
      sub: 'Ask about porcelain veneers, planned with Digital Smile Design.',
      list: ['Shape and shade planned digitally', 'Your options explained', 'Cost up front'] },
    implant5000: { eyebrow: 'Dental implant', h1: 'One implant. <em>One clear price.</em>',
      label: 'All-in', price: '<small>RM</small>5,000',
      list: ['Implant fixture', 'Custom abutment', 'Ceramic crown', 'Dental X-ray & 3D CBCT'],
      fine: 'Includes assessment and treatment planning. Suitability confirmed at consultation. Terms apply.' },
    aligner: { eyebrow: 'Clear aligners', h1: 'Straighten your teeth, <em>discreetly.</em>',
      label: 'Package from', price: '<small>RM</small>6,000', to: 'to RM 9,900',
      list: ['Consultation & X-ray', 'Digital intra-oral scan', 'Full set of aligners', '1 pair of retainers'],
      fine: 'Price depends on your case. Terms apply.' },
    scaling: { eyebrow: 'Scaling, polishing & whitening', h1: 'Clean teeth. <em>A brighter smile.</em>',
      label: 'Package', price: '<small>RM</small>399',
      list: ['Scaling & polishing', 'In-office teeth whitening'],
      fine: 'Results vary from person to person. Terms apply.' },
  },
  zh: {
    branch: '哥打白沙罗', creds: '理大牙科学士 · 18年临床经验', book: 'WhatsApp 预约',
    addr: '哥打白沙罗',
    braces: { eyebrow: '牙套 · 隐适美', h1: '传统牙套还是隐适美？<br><em>先问清楚再决定。</em>',
      sub: '金属、陶瓷、自锁牙套，<br>或隐形牙套。',
      list: ['咬合与排列检查', '为你讲解各种选择', '疗程时间和费用先说清楚'] },
    implants: { eyebrow: '种植牙', h1: '缺了一颗牙？<br><em>看看种植牙适不适合你。</em>',
      sub: '决定之前，<br>先了解清楚整个过程。',
      list: ['评估是否适合', '3D CBCT 扫描', '疗程时间和费用先说清楚'] },
    veneers: { eyebrow: '瓷贴片', h1: '门牙缺角、发黄<br><em>或不整齐？</em>',
      sub: '了解瓷贴片，<br>以数字微笑设计（DSD）规划。',
      list: ['数字规划牙齿形状与颜色', '为你讲解各种选择', '费用先说清楚'] },
    implant5000: { eyebrow: '种植牙', h1: '一颗种植牙，<br><em>一个清楚的价钱。</em>',
      label: '全包', price: '<small>RM</small>5,000',
      list: ['种植体', '定制基台', '陶瓷牙冠', '牙科X光与3D CBCT'],
      fine: '包括评估与治疗规划。是否适合需经咨询确认。附带条款。' },
    aligner: { eyebrow: '隐形牙套', h1: '低调地<br><em>把牙齿排整齐。</em>',
      label: '配套价', price: '<small>RM</small>6,000', to: '至 RM 9,900',
      list: ['咨询与X光', '数字口内扫描', '全套隐形牙套', '一副保持器'],
      fine: '价钱视个案而定。附带条款。' },
    scaling: { eyebrow: '洗牙 · 抛光 · 美白', h1: '牙齿干净，<br><em>笑容更亮。</em>',
      label: '配套价', price: '<small>RM</small>399',
      list: ['洗牙与抛光', '诊所牙齿美白'],
      fine: '效果因人而异。附带条款。' },
  },
};

const t = T[l], s = t[c];
document.getElementById('logo').src = PRICE ? 'source/Site-Logo-White.png' : 'source/Group1.png';
for (const k of ['branch', 'creds', 'book', 'addr']) document.getElementById(k).innerHTML = t[k];
for (const k of ['eyebrow', 'h1']) document.getElementById(k).innerHTML = s[k];
const list = `<div class="list">${s.list.map(x => `<p>${x}</p>`).join('')}</div>`;
document.getElementById('col').innerHTML = PRICE
  ? `<div><div class="price-label">${s.label}</div><div class="price">${s.price}</div>${s.to ? `<div class="price-to">${s.to}</div>` : ''}</div>${list}<p class="fine">${s.fine}</p>`
  : `<p class="sub">${s.sub}</p>${list}`;
</script>
</body>
</html>
