<!doctype html>
<html lang="zh" class="f916">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Smile Arts Kota Damansara · Braces or Invisalign</title>
    <script src="assets/gsap.min.js"></script>
    <style>
  @font-face { font-family: Tajawal; font-weight: 400; src: url(assets/fonts/Tajawal-400-latin.woff2); }
  @font-face { font-family: Tajawal; font-weight: 500; src: url(assets/fonts/Tajawal-500-latin.woff2); }
  @font-face { font-family: Tajawal; font-weight: 700; src: url(assets/fonts/Tajawal-700-latin.woff2); }
  @font-face { font-family: Tajawal; font-weight: 800; src: url(assets/fonts/Tajawal-800-latin.woff2); }
  @font-face { font-family: "Noto Sans SC"; font-weight: 500; src: url(assets/fonts/NotoSansSC-500-smilearts-subset.woff2); }
  @font-face { font-family: "Noto Sans SC"; font-weight: 700; src: url(assets/fonts/NotoSansSC-700-smilearts-subset.woff2); }
  :root { --sans: Tajawal, "Noto Sans SC", Arial, sans-serif;
          --taupe: #a89379; --deep: #6b5a45; --ink: #2b241d; --ink-2: #5a5045; --ivory: #faf7f2; --sand: #efe7dc;
          --hair: rgba(168,147,121,.45); }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: var(--ivory); }
  .ad { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--ivory); color: var(--ink); font-family: var(--sans); }
  .f45 .ad { height: 1350px; }

  /* photo */
  .photo { position: absolute; left: 0; right: 0; top: 0; height: 980px; overflow: hidden; }
  .f45 .photo { height: 600px; }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(43,36,29,.18) 0%, rgba(43,36,29,0) 24%, rgba(250,247,242,0) 70%, var(--ivory) 100%); }
  .avatar { position: absolute; right: 70px; top: 720px; width: 230px; height: 230px; border-radius: 50%; overflow: hidden; border: 8px solid var(--ivory); box-shadow: 0 18px 40px rgba(43,36,29,.25); z-index: 2; }
  .f45 .avatar { top: 380px; width: 190px; height: 190px; right: 60px; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }

  /* credentials over the photo */
  .creds { position: absolute; left: 70px; top: 745px; display: flex; flex-direction: column; align-items: flex-start; gap: 12px; z-index: 2; }
  .f45 .creds { top: 400px; gap: 10px; }
  .creds span { background: rgba(250,247,242,.94); color: var(--ink); font: 500 30px/1 var(--sans); padding: 15px 22px 11px; border-radius: 999px; box-shadow: 0 8px 22px rgba(43,36,29,.14); }
  .creds span b { font-weight: 800; color: var(--deep); }
  .f45 .creds span { font-size: 26px; padding: 13px 20px 9px; }

  /* text */
  .box { position: absolute; left: 70px; right: 70px; top: 960px; display: flex; flex-direction: column; gap: 24px; }
  .f45 .box { top: 600px; gap: 18px; }
  .head { display: flex; justify-content: space-between; align-items: center; }
  .head img { height: 64px; }
  .f45 .head img { height: 54px; }
  .head span { font: 700 24px var(--sans); letter-spacing: .14em; color: var(--deep); text-transform: uppercase; }
  .f45 .head span { font-size: 21px; }
  .eyebrow { font: 700 26px var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--taupe); }
  h1 { font: 800 92px/1.02 var(--sans); letter-spacing: -.02em; color: var(--ink); }
  .f45 h1 { font-size: 74px; }
  h1 em { font-style: normal; color: var(--deep); }
  .sub { font: 400 36px/1.32 var(--sans); color: var(--ink-2); }
  .f45 .sub { font-size: 32px; }
  .sub b { font-weight: 700; color: var(--ink); }
  .rule { height: 2px; background: var(--hair); width: 120px; }

  .cta { align-self: flex-start; display: inline-flex; align-items: center; gap: 22px; background: var(--deep); color: #fff; font: 700 36px/1 var(--sans); padding: 26px 40px 22px 26px; border-radius: 999px; box-shadow: 0 18px 36px rgba(107,90,69,.32); margin-top: 6px; }
  .f45 .cta { font-size: 32px; padding: 22px 34px 18px 22px; }
  .cta i { flex: none; width: 64px; height: 64px; border-radius: 50%; background: #25d366; display: grid; place-items: center; margin-top: -4px; }
  .f45 .cta i { width: 56px; height: 56px; }
  .cta svg { width: 60%; height: 60%; }
  .note { font: 500 26px var(--sans); color: var(--ink-2); display: flex; align-items: center; gap: 12px; }
  .note::before { content: ""; width: 14px; height: 14px; border-radius: 50%; background: #25d366; box-shadow: 0 0 0 6px rgba(37,211,102,.18); }
  .f45 .note { font-size: 23px; }

  .foot { border-top: 2px solid var(--hair); padding-top: 24px; margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
  .f45 .foot { padding-top: 16px; margin-top: 4px; }
  .creds.top { top: 300px; }
  .f45 .creds.top { top: 36px; }
  .foot b { font: 700 28px var(--sans); color: var(--ink); }
  .foot span { font: 400 26px var(--sans); color: var(--ink-2); }
  .f45 .foot b { font-size: 24px; }
  .f45 .foot span { font-size: 23px; }
  [lang="zh"] h1 { font-size: 84px; line-height: 1.18; letter-spacing: 0; }
  .f45[lang="zh"] h1 { font-size: 70px; }
  [lang="zh"] .eyebrow, [lang="zh"] .head span { letter-spacing: .08em; }

  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  .clip { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="7.5" data-width="1080" data-height="1920">
      <div class="ad clip" data-start="0" data-duration="7.5" data-track-index="0">
  <div class="photo"><img id="photo" alt="" src="smilearts/source/daren-f6.jpg" style="object-position: 50% 30%;"></div>
  
  <div class="creds top" id="creds"><span><b>Dr. Daren Ang</b> · 理大牙科学士</span><span><b>18年</b>临床经验</span></div>
  <div class="box">
    <div class="head"><img src="smilearts/source/Group1.png" alt="Smile Arts Dental Clinic"><span id="branch">哥打白沙罗</span></div>
    <div class="eyebrow" id="eyebrow">牙套 · 隐适美</div>
    <h1 id="h1">传统牙套还是隐适美？<br><em>先问清楚再决定。</em></h1>
    <p class="sub" id="sub">金属、陶瓷、自锁牙套或隐形牙套。<br><b>2016年起</b>为 Invisalign 认证医生。</p>
    <div class="cta"><i><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2.2a9.8 9.8 0 0 0-8.4 14.8L2.3 21.7l4.8-1.3A9.8 9.8 0 1 0 12 2.2zm0 17.8a8 8 0 0 1-4.1-1.1l-.3-.2-2.8.8.8-2.7-.2-.3A8 8 0 1 1 12 20zm4.4-6c-.2-.1-1.4-.7-1.6-.8s-.4-.1-.5.1-.6.8-.8.9-.3.2-.5.1a6.6 6.6 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.7-1.7c-.2-.5-.4-.4-.5-.4h-.5a.9.9 0 0 0-.7.3 2.8 2.8 0 0 0-.9 2.1 4.9 4.9 0 0 0 1 2.6 11.2 11.2 0 0 0 4.3 3.8c1.6.7 2.2.7 3 .6a2.6 2.6 0 0 0 1.7-1.2 2.1 2.1 0 0 0 .1-1.2c0-.1-.2-.2-.4-.3z"></path></svg></i><span id="cta">WhatsApp 预约咨询</span></div>
    <div class="note" id="note">诊所营业时间内，通常15分钟内回复</div>
    <div class="foot"><b id="addr1">Smile Arts Dental · 哥打白沙罗 The Strand</b><span id="addr2">No. 55-1, Jalan PJU 5/20, 47810 Petaling Jaya</span></div>
  </div>
</div>
      <audio id="music" src="assets/music-motion-smilearts.mp3" data-start="0" data-duration="7.5" data-volume="1" data-track-index="8"></audio>
    </div>
    <script>
      const B = 60 / 92, DUR = 7.5;
      const tl = gsap.timeline({ paused: true });

      tl.fromTo('.photo img', { scale: 1.14 }, { scale: 1, duration: DUR, ease: 'power1.out' }, 0);
      tl.fromTo('.photo', { opacity: 0 }, { opacity: 1, duration: 0.6, ease: 'power1.out' }, 0);
      tl.fromTo('.creds span', { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.5, ease: 'expo.out', stagger: 0.18 }, 0.5 * B);
      tl.fromTo('.avatar', { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.6, ease: 'back.out(1.8)' }, 0.75 * B);
      tl.fromTo('.head', { opacity: 0, y: -16 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power2.out' }, 0.5 * B);
      tl.fromTo('.eyebrow', { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.5, ease: 'power2.out' }, 0.75 * B);
      tl.fromTo('h1', { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.8, ease: 'expo.out' }, 1 * B);
      tl.fromTo('h1 em', { opacity: 0 }, { opacity: 1, duration: 0.5, ease: 'power1.out' }, 1.5 * B);
      tl.fromTo('.sub', { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: 'expo.out' }, 2.25 * B);
      tl.fromTo('.cta', { opacity: 0, y: 60, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: 'back.out(1.6)' }, 3.5 * B - 0.1);
      tl.fromTo('.note', { opacity: 0 }, { opacity: 1, duration: 0.5 }, 4.25 * B);
      tl.fromTo('.foot', { opacity: 0 }, { opacity: 1, duration: 0.6 }, 4.5 * B);
      tl.fromTo('.cta', { scale: 1 }, { scale: 1.045, duration: B / 2, repeat: 7, yoyo: true, ease: 'sine.inOut' }, 5 * B);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
